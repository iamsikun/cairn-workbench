# Refresh public metadata independently of the jobs that write the knowledge base.
name: Cairn catalog (reusable)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      config:
        type: string
        default: cairn-workbench.toml
      force:
        type: boolean
        default: false
    secrets:
      OPENALEX_API_KEY:
        required: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: cairn-catalog
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CAIRN_WORKBENCH_CONFIG: ${{ github.workspace }}/kb/${{ inputs.config }}
      CAIRN_CATALOG_DIR: ${{ github.workspace }}/catalog
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      WORKBENCH: git+https://github.com/iamsikun/cairn-workbench@${{ inputs.version }}
      # Runs beside each refresh phase. It logs disk use every five minutes and stops the phase
      # before the disk fills: a full disk also kills the runner, losing the job log.
      DISK_GUARD: |
        n=0
        while kill -0 "$WORK" 2>/dev/null && sleep 30; do
          free=$(df --output=avail -BM / | tail -1 | tr -dc 0-9)
          if [ $((n % 10)) -eq 0 ]; then df -h / /mnt 2>/dev/null | sed 's/^/disk: /'; fi
          n=$((n + 1))
          if [ "$free" -lt 2048 ]; then
            echo "::error::Stopping the catalog refresh: under 2 GiB left on the runner's disk"
            df -h / /mnt 2>/dev/null
            du -xsh "$CAIRN_CATALOG_DIR"/* "$CAIRN_CATALOG_DIR"/.refresh* 2>/dev/null | sort -h | tail
            kill "$WORK"
            exit
          fi
        done
    steps:
      - uses: actions/checkout@v7
        with:
          path: kb
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the catalog tools
        run: |
          uv tool install "cairn-garden @ $WORKBENCH#subdirectory=packages/gardener" \
            --with-executables-from cairn-catalog

      # Most runs find the catalog fresh. Decide from the published edition's update record, a
      # small cache saved beside it, and download the multi-gigabyte edition only to refresh it.
      - name: Look up the last published edition
        id: lookup
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/catalog
            !${{ github.workspace }}/catalog/.refreshes/**
            !${{ github.workspace }}/catalog/.refresh-checkpoint/**
          key: cairn-edition-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cairn-edition-v1-
          lookup-only: true

      - name: Restore the published edition's update record
        id: record
        if: steps.lookup.outputs.cache-matched-key != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/edition-record
          key: cairn-edition-record-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cairn-edition-record-v1-

      # Without a record (an edition saved before records existed, or one evicted), restore the
      # edition and judge it as before.
      - name: Decide whether to refresh
        env:
          FORCE: ${{ inputs.force }}
          RECORD: ${{ steps.record.outputs.cache-matched-key != '' }}
        run: |
          if [ "$FORCE" = true ]; then
            echo "CATALOG_REFRESH=true" >> "$GITHUB_ENV"
          elif [ "$RECORD" = true ]; then
            if ! cairn-garden ci catalog-fresh --max-age 6 \
                --record "$GITHUB_WORKSPACE/edition-record/update-state.json" > /dev/null; then
              echo "CATALOG_REFRESH=true" >> "$GITHUB_ENV"
            fi
          else
            echo "CATALOG_RESTORE=true" >> "$GITHUB_ENV"
          fi

      - name: Reserve space for the journal catalog
        if: env.CATALOG_REFRESH == 'true' || env.CATALOG_RESTORE == 'true'
        run: |
          # A refresh stages a whole new edition beside the restored one: about twice its size.
          # The Python and Node tool caches stay; the installed tools run on them.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go /opt/hostedtoolcache/Ruby \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Java_* /opt/ghc /opt/microsoft /opt/google \
            /opt/az /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/julia*
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          # SQLite's sort and temporary-table files go to the second disk when it has room.
          if [ -d /mnt ] && sudo mkdir -p /mnt/cairn-tmp && sudo chown "$(id -u)" /mnt/cairn-tmp; then
            if [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -ge 10 ]; then
              echo "SQLITE_TMPDIR=/mnt/cairn-tmp" >> "$GITHUB_ENV"
              echo "TMPDIR=/mnt/cairn-tmp" >> "$GITHUB_ENV"
            fi
          fi
          df -h / /mnt 2>/dev/null || true
          python3 - <<'PY'
          import os, shutil
          free = shutil.disk_usage(os.environ['GITHUB_WORKSPACE']).free / 2**30
          print(f'Available space for catalog: {free:.1f} GiB')
          if free < 30:
              raise SystemExit('Catalog requires at least 30 GiB free for a staged edition')
          PY

      - name: Restore the last published edition
        id: edition
        if: env.CATALOG_REFRESH == 'true' || env.CATALOG_RESTORE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/catalog
            !${{ github.workspace }}/catalog/.refreshes/**
            !${{ github.workspace }}/catalog/.refresh-checkpoint/**
          key: cairn-edition-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cairn-edition-v1-

      - name: Restore a legacy catalog
        if: >-
          (env.CATALOG_REFRESH == 'true' || env.CATALOG_RESTORE == 'true')
          && steps.edition.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/catalog
          key: cairn-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cairn-catalog-

      - name: Judge the restored edition
        if: env.CATALOG_RESTORE == 'true'
        run: |
          if ! cairn-garden ci catalog-fresh --max-age 6 > /dev/null; then
            echo "CATALOG_REFRESH=true" >> "$GITHUB_ENV"
          fi

      # This namespace can never match a gardening job's published-edition restore.
      # A version-specific key prevents resuming derived data built by different code.
      - name: Restore the last completed refresh phase
        if: env.CATALOG_REFRESH == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/catalog/.refresh-checkpoint
          key: cairn-refresh-v1-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: cairn-refresh-v1-${{ inputs.version }}-

      - name: Collect source metadata
        id: sources
        if: env.CATALOG_REFRESH == 'true'
        run: |
          cairn-catalog update --phase sources --keep-notes &
          work=$!
          WORK=$work bash -c "$DISK_GUARD" &
          trap "kill $! 2>/dev/null" EXIT
          wait "$work"

      - name: Save source progress before building
        if: steps.sources.outputs.checkpoint == 'sources'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/catalog/.refresh-checkpoint
          key: cairn-refresh-v1-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-sources

      - name: Build the catalog
        id: build
        if: env.CATALOG_REFRESH == 'true'
        run: |
          cairn-catalog update --phase build --keep-notes &
          work=$!
          WORK=$work bash -c "$DISK_GUARD" &
          trap "kill $! 2>/dev/null" EXIT
          wait "$work"

      - name: Save build progress before verification
        if: steps.build.outputs.checkpoint == 'build'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/catalog/.refresh-checkpoint
          key: cairn-refresh-v1-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}-build

      - name: Verify and publish the edition
        id: publish
        if: env.CATALOG_REFRESH == 'true'
        run: |
          cairn-catalog update --phase publish --keep-notes &
          work=$!
          WORK=$work bash -c "$DISK_GUARD" &
          trap "kill $! 2>/dev/null" EXIT
          wait "$work"

      # Save immediately, before summaries or any other work can fail.
      - name: Save the published edition
        id: save_edition
        if: steps.publish.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/catalog
            !${{ github.workspace }}/catalog/.refreshes/**
            !${{ github.workspace }}/catalog/.refresh-checkpoint/**
          key: cairn-edition-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # Only for an edition in the cache: a record must never describe a missing edition. A run
      # that had to restore a fresh edition records it too, so the next run can skip the download.
      - name: Copy the edition's update record
        id: copy_record
        if: >-
          steps.save_edition.outcome == 'success'
          || (env.CATALOG_RESTORE == 'true' && env.CATALOG_REFRESH != 'true'
              && steps.edition.outputs.cache-matched-key != '')
        run: |
          mkdir -p "$GITHUB_WORKSPACE/edition-record"
          cp "$CAIRN_CATALOG_DIR/update-state.json" "$GITHUB_WORKSPACE/edition-record/"

      - name: Save the edition's update record
        if: steps.copy_record.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/edition-record
          key: cairn-edition-record-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Catalog summary
        if: always()
        env:
          REFRESH: ${{ env.CATALOG_REFRESH }}
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          python3 - <<'PY'
          import os
          if os.environ['PUBLISHED'] == 'success':
              result = 'Verified edition published; gardening can read it on the next run.'
          elif os.environ['REFRESH'] == 'true':
              result = 'Refresh incomplete. The next attempt resumes the last cached phase.'
          else:
              result = 'No refresh completed; see the freshness check and preceding steps.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Journal catalog\n\n' + result + '\n')
          PY

      - name: Keep catalog diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/catalog/update-report.json
            ${{ github.workspace }}/catalog/.refresh-checkpoint/checkpoint.json
            ${{ github.workspace }}/catalog/.refresh-checkpoint/report.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore
