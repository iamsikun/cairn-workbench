name: Native synthetic acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.9.3'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19.0'
      - run: echo "CAIRN_NODE20=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - run: echo "CAIRN_NODE22=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.12.0'
      - run: echo "CAIRN_NODE24=$(command -v node)" >> "$GITHUB_ENV"
      - name: Acquire locked native dependencies
        run: |
          UV_NO_CONFIG=1 UV_CACHE_DIR="$PWD/.cache/uv" uv sync --locked
          cd vendor/answer-me-with-html
          npm ci --ignore-scripts --userconfig /dev/null
      - name: Acquire Linux renderer tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-noto-cjk fonts-noto-core
          echo "AM_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Acquire macOS renderer tools
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          echo 'AM_CHROME=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome' >> "$GITHUB_ENV"
      - name: Verify native code with synthetic data
        run: bash scripts/check.sh
      - name: Verify native renderer and portable packages
        run: bash scripts/check_html.sh
      - name: Verify offline installed native release
        run: bash scripts/release_check.sh
