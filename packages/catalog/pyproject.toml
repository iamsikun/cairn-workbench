[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cairn-catalog"
version = "0.6.3"
description = "A public journal catalog with an offline browser that feeds a Cairn knowledge base"
requires-python = ">=3.12"
dependencies = ["cairn-workbench", "PyYAML>=6.0.2,<7", "requests>=2.32,<3"]

[project.scripts]
cairn-catalog = "cairn_catalog.cli:main"

[tool.uv.sources]
cairn-workbench = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_catalog"]
