[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cairn-workbench"
version = "0.4.0"
description = "A Markdown research knowledge base that your agent writes while you read"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "markdown-it-py>=3,<5"]

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
