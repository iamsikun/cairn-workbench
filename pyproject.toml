[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cairn-workbench"
version = "0.1.1"
description = "Local-first evidence, reviewable knowledge, and scoped agent context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "typer>=0.16,<1", "PyYAML>=6.0.2,<7", "pypdf>=6,<7"]

[project.optional-dependencies]
reader = ["pypdfium2==5.13.0", "Pillow==12.3.0"]

[project.scripts]
cairn = "cairn.cli:app"
cairn-device = "cairn.library.device_runner:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "mypy>=1.16,<2", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["isolation: requires a local Docker daemon and the built worker image"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Preserve the checksummed, licensed Finch snapshot verbatim.
"src/cairn/reading/resources/finch/scripts/extract_pdf.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cairn"]
mypy_path = "src"
