[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cairn-workbench"
version = "0.8.2"
description = "A Markdown research knowledge base that your agent writes while you read"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0.2,<7", "markdown-it-py>=3,<5"]

[project.scripts]
cairn = "cairn.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1", "cairn-catalog", "cairn-garden", "cairn-studio"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cairn-catalog = { workspace = true }
cairn-garden = { workspace = true }
cairn-studio = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/catalog/tests", "packages/gardener/tests", "packages/studio/tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Ported tooling keeps its long SQL statements and inline lambdas.
"packages/**" = ["E501", "E731"]
# fix_body's helpers run within the loop iteration that defines them.
"packages/gardener/src/cairn_garden/engine.py" = ["E501", "E731", "B023"]
